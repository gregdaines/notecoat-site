<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoteCoat</title>
<meta name="description" content="Notebooks and covers built for hard use.">
<meta property="og:title" content="NoteCoat">
<meta property="og:description" content="Notebooks and covers built for hard use.">
<meta property="og:image" content="https://notecoat.com/img/cover-black.jpg">
<meta property="og:url" content="https://notecoat.com/">
<link rel="icon" href="img/dragonfly.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Old+Standard+TT:ital,wght@0,400;1,400&display=swap">
<style>
:root { --paper: #f4efe3; --ink: #1d2a49; --text: #23211e; --muted: #5d5a52; --rule: #1d2a49; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--text); font: 400 18px/1.55 'Old Standard TT', Georgia, serif; }
.wrap { max-width: 920px; margin: 0 auto; padding: 40px 16px 56px; }
header { text-align: center; }
.device { width: 120px; height: auto; display: block; margin: 0 auto 10px; }
h1 { font: 600 clamp(40px, 9vw, 68px)/1 Oswald, 'Arial Narrow', sans-serif; letter-spacing: .12em; color: var(--ink); margin: 0; padding-left: .12em; }
.dbl { width: 220px; margin: 14px auto 16px; border-top: 2px solid var(--rule); border-bottom: 1px solid var(--rule); height: 5px; }
.line { font-style: italic; font-size: 21px; margin: 0; }
.makes { font: 500 13px/1.4 Oswald, 'Arial Narrow', sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); margin: 18px 0 0; }
.photos { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 44px 0 0; }
figure { margin: 0; }
figure img { display: block; width: 100%; height: auto; border: 1px solid #cfc6b0; }
.photos img { aspect-ratio: 3 / 4; object-fit: cover; }
figcaption { font-size: 15px; color: var(--muted); margin-top: 6px; text-align: center; }
.plate { margin: 48px 0 0; }
.plate img { border: 0; }
.contact { text-align: center; margin: 52px 0 0; }
.contact h2 { font: 500 14px Oswald, 'Arial Narrow', sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--ink); margin: 0 0 6px; }
.contact a { color: var(--ink); font-size: 22px; text-decoration: none; border-bottom: 1px solid currentColor; }
footer { text-align: center; margin-top: 52px; font-size: 14px; color: var(--muted); }
footer .dbl { width: 120px; margin-bottom: 12px; }
@media (max-width: 620px) { .photos { grid-template-columns: 1fr; } body { font-size: 17px; } .line { font-size: 19px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="device" src="img/dragonfly.png" alt="Pen-and-ink drawing of a dragonfly" width="360" height="317">
    <h1>NOTECOAT</h1>
    <div class="dbl"></div>
    <p class="line">Notebooks and covers built for hard use.</p>
    <p class="makes">Leather notebook covers &middot; Base books &middot; Accessories</p>
  </header>

  <section class="photos" aria-label="Covers">
    <figure><img src="img/cover-black.jpg" alt="A NoteCoat cover in black leather, closed, with a black strap and a brass G-hook" width="900" height="1256"><figcaption>No. 201 cover, black leather.</figcaption></figure>
    <figure><img src="img/cover-brown.jpg" alt="An early NoteCoat cover in brown leather, closed, with a green strap and a brass G-hook" width="900" height="1159"><figcaption>No. 201 cover, an early prototype.</figcaption></figure>
  </section>

  <figure class="plate"><img src="img/woolsthorpe-manor.jpg" alt="Pen-and-ink drawing of Woolsthorpe Manor, a stone farmhouse" width="1200" height="881" loading="lazy"><figcaption>Woolsthorpe Manor. Pen and ink by Greg Daines.</figcaption></figure>

  <section class="contact">
    <h2>Contact</h2>
    <a href="mailto:hello@notecoat.com">hello@notecoat.com</a>
  </section>

  <footer>
    <div class="dbl"></div>
    Made in USA. &middot; &copy; 2026 NoteCoat
  </footer>
</div>
</body>
</html>
